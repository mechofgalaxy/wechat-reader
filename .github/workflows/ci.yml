name: Reader checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked core dependencies
        run: python -m pip install --require-hashes -r requirements-core.lock
      - name: Compile Apple helper
        if: runner.os == 'macOS'
        run: xcrun swiftc -O -target arm64-apple-macosx14.0 image_native.swift -o image_native
      - name: Verify public files and synthetic contracts
        run: |
          python scripts/check_public.py
          python -m unittest discover -s tests -v
          ./wechat-reader demo
          ./wechat-reader runtime-status
